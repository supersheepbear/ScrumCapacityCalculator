[project]
name = "scrum-capacity-calculator"
version = "1.1.0"
description = "Local single-Sprint capacity calculator with Jira CSV import"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3,<4",
    "holidays>=0.38,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrum_capacity_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
